name: 월별 자산 스냅샷 자동 저장

on:
  schedule:
    # 매일 UTC 15:10 = 한국시간(KST, UTC+9) 다음날 00:10에 실행.
    # GitHub Actions cron은 "매월 1일"을 직접 지정할 수 없어(달마다 말일이 달라서),
    # 매일 실행하고 monthly_snapshot_job.py 안에서 "오늘이 KST 기준 1일"인지 검사한다.
    - cron: "10 15 * * *"
  workflow_dispatch:
    # 수동 실행 버튼(Actions 탭 > Run workflow)도 함께 열어둔다.
    # 강제로 오늘 날짜 상관없이 돌려보고 싶으면 force_run을 'true'로 지정.
    inputs:
      force_run:
        description: "1일이 아니어도 강제로 실행 (테스트용)"
        required: false
        default: "false"

jobs:
  monthly-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 패키지 설치
        run: |
          pip install gspread google-auth google-auth-oauthlib google-api-python-client \
                      cryptography pandas yfinance

      - name: 월별 스냅샷 스크립트 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACCOUNTS_SPREADSHEET_ID: ${{ secrets.ACCOUNTS_SPREADSHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '' }}
        run: python monthly_snapshot_job.py
