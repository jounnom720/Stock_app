name: 일일 리포트 이메일 자동 발송

on:
  schedule:
    # 매일 UTC 01:05 = 한국시간(KST, UTC+9) 10:05에 실행.
    # [2026-08-25] 원래 07:30(장 시작 전 브리핑)이었으나 사용자 요청으로 10:00으로 변경.
    # [2026-08-27] 10:00(정각)으로 설정했던 날 스케줄이 아예 발동하지 않는 문제 발생(#9 이후
    # 다음날 실행 이력 없음). GitHub 공식 문서에 "예약 실행은 매 시 정각에 몰려서 지연되거나
    # 부하가 심하면 아예 스킵될 수 있다"고 명시되어 있어, 정각을 피해 10:05로 5분 미룸.
    - cron: "5 1 * * *"
  workflow_dispatch:
    # 수동 실행 버튼(Actions 탭 > Run workflow)도 함께 열어둔다.
    # 주말에도 강제로 돌려보고 싶으면 force_run을 'true'로 지정.
    inputs:
      force_run:
        description: "주말이어도 강제로 실행 (테스트용)"
        required: false
        default: "false"

jobs:
  daily-report-email:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 패키지 설치
        run: |
          pip install gspread google-auth google-auth-oauthlib google-api-python-client \
                      cryptography pandas yfinance pykrx requests

      - name: 일일 리포트 이메일 발송 스크립트 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACCOUNTS_SPREADSHEET_ID: ${{ secrets.ACCOUNTS_SPREADSHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          UNSUBSCRIBE_WEBAPP_URL: ${{ secrets.UNSUBSCRIBE_WEBAPP_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '' }}
        run: python daily_report_email_job.py
