name: 일일 리포트 이메일 자동 발송

on:
  schedule:
    # 매일 UTC 22:30 = 한국시간(KST, UTC+9) 07:30에 실행 (장 시작 09:00 전 브리핑).
    - cron: "30 22 * * *"
  workflow_dispatch:
    # 수동 실행 버튼(Actions 탭 > Run workflow)도 함께 열어둔다.
    # 주말에도 강제로 돌려보고 싶으면 force_run을 'true'로 지정.
    inputs:
      force_run:
        description: "주말이어도 강제로 실행 (테스트용)"
        required: false
        default: "false"

jobs:
  daily-report-email:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 패키지 설치
        run: |
          pip install gspread google-auth google-auth-oauthlib google-api-python-client \
                      cryptography pandas yfinance pykrx requests

      - name: 일일 리포트 이메일 발송 스크립트 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ACCOUNTS_SPREADSHEET_ID: ${{ secrets.ACCOUNTS_SPREADSHEET_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          UNSUBSCRIBE_WEBAPP_URL: ${{ secrets.UNSUBSCRIBE_WEBAPP_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run == 'true' && '1' || '' }}
        run: python daily_report_email_job.py
